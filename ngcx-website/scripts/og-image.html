<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<style>
@font-face{font-family:Manrope;font-weight:200 800;src:url('../public/fonts/manrope-latin-var.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#080B10;font-family:Manrope,sans-serif;color:#F5F7FA;position:relative;overflow:hidden;
  background-image:radial-gradient(ellipse at top,rgba(8,123,255,.22),transparent 62%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(216,220,228,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(216,220,228,.035) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 40%,#000 30%,transparent 100%)}
.inner{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 96px}
img{width:400px;mix-blend-mode:lighten;margin-bottom:44px}
h1{font-size:60px;font-weight:700;letter-spacing:-.02em;line-height:1.08;max-width:900px}
h1 em{color:#5CC8FF;font-style:normal}
p{margin-top:26px;font-size:24px;color:#AAB4C0}
.claim{position:absolute;bottom:52px;left:96px;font-size:16px;letter-spacing:.24em;text-transform:uppercase;color:#AAB4C0}
.claim b{color:#5CC8FF;font-weight:500}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#087BFF,#5CC8FF 60%,transparent)}
</style></head>
<body><div class="grid"></div>
<div class="inner">
  <img src="../public/img/ngcx-wordmark-480.png" alt="">
  <h1>Neukunden, die <em>nicht vom Zufall</em> abhängen.</h1>
  <p>Growth Partner für IT-Beratungen &amp; Softwareagenturen im DACH-Raum</p>
</div>
<div class="claim"><b>Know.</b> Decide. Grow.</div>
<div class="bar"></div>
</body></html>
