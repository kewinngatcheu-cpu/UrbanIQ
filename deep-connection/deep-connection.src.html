/* Layout: one narrow editorial column (max 640px), magazine-style report, sticky module progress bar. */
:root {
  --cream: #f8f4ee;
  --paper: #fffdf9;
  --champagne: #ecdfc8;
  --beige: #d9c8ad;
  --taupe: #9a8b7c;
  --ink: #2b2826;
  --ink-soft: #6b625a;
  --gold: #b08d57;
  --gold-deep: #8a6a3b;
  --line: #e7dccb;
  --good: #5f7a52;
  --warn: #b07a2a;
  --bad: #a04a3c;
  --display: "Bodoni Moda", "Didot", Georgia, serif;
  --sans: "Jost", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--cream); color: var(--ink); font: 300 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 120px; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.6rem, 11vw, 4.4rem); line-height: .95; }
h2 { font-size: clamp(1.9rem, 7vw, 2.7rem); line-height: 1.05; }
h3 { font-size: 1.45rem; line-height: 1.2; }
em, .it { font-style: italic; }
p { margin: 0; }
.eyebrow { font: 500 .68rem/1.4 var(--sans); letter-spacing: .28em; text-transform: uppercase; color: var(--gold-deep); }
.muted { color: var(--ink-soft); }
.small { font-size: .86rem; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-lg { display: flex; flex-direction: column; gap: 40px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 999px; padding: 16px 26px; font: 500 .72rem/1 var(--sans); letter-spacing: .24em; text-transform: uppercase; background: var(--ink); color: var(--paper); transition: transform .2s, background .2s; }
.btn:hover { background: #000; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.gold { background: var(--gold); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--beige); }
.btn.link { background: none; color: var(--ink-soft); padding: 10px 4px; letter-spacing: .18em; }
.btn:focus-visible, .opt:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--champagne); outline-offset: 2px; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 22px; }
.card.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.card.dark .muted { color: #cbbfb2; }
.card.dark .eyebrow { color: var(--champagne); }
.hr { height: 1px; background: var(--line); border: 0; margin: 0; }
/* Hero */
.hero { position: relative; margin-top: 8px; }
.hero-photo { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 30%; border-radius: 28px; display: block; max-width: 100%; }
.hero-tag { position: absolute; left: 16px; bottom: 16px; right: 16px; color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.35); }
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
.strip img { height: 150px; width: auto; border-radius: 14px; scroll-snap-align: start; flex: 0 0 auto; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.facts b { display: block; font: 400 2rem/1 var(--display); }
.facts span { font-size: .66rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-soft); }
/* Module list */
.mod { display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center; text-align: left; width: 100%; cursor: pointer; font: inherit; color: inherit; }
.mod img { width: 84px; height: 104px; object-fit: cover; border-radius: 14px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font: 500 .62rem/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; background: var(--champagne); color: var(--gold-deep); }
.pill.done { background: #e3e8dc; color: var(--good); }
.pill.wait { background: #f3e6cf; color: var(--warn); }
/* Question */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--cream); padding: 12px 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--cream); }
.track { height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
.track i { display: block; height: 100%; background: var(--gold); transition: width .5s cubic-bezier(.22,1,.36,1); }
.qnum { font: italic 400 3.2rem/1 var(--display); color: var(--beige); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; gap: 14px; align-items: center; text-align: left; width: 100%; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--paper); font: 400 1rem/1.35 var(--sans); color: var(--ink); cursor: pointer; transition: border-color .2s, background .2s; }
.opt .dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--beige); flex: 0 0 auto; display: grid; place-items: center; font-size: .7rem; color: transparent; }
.opt[aria-checked="true"] { border-color: var(--ink); background: #fbf6ee; }
.opt[aria-checked="true"] .dot { background: var(--ink); border-color: var(--ink); color: var(--paper); }
textarea, input[type=number], input[type=text] { width: 100%; font: 400 1rem/1.5 var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
textarea { min-height: 140px; resize: vertical; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: rgba(248,244,238,.96); border-top: 1px solid var(--line); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.nav .in { max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.err { color: var(--bad); font-size: .9rem; }
/* Report */
.score { font: 400 4.6rem/1 var(--display); font-variant-numeric: tabular-nums; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.meter { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--beige), var(--gold)); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: .92rem; }
.cmp div { min-width: 0; }
.cmp .who { font: 500 .6rem/1.2 var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--taupe); margin-bottom: 4px; }
.ok { color: var(--good); }
.no { color: var(--bad); }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .9rem; }
.tbl td, .tbl th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
.scroll-x { overflow-x: auto; }
.flag { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
.quote { font: italic 400 1.35rem/1.35 var(--display); }
.fade { animation: fade .7s cubic-bezier(.22,1,.36,1) both; }
@keyframes fade { from { opacity: .001; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .track i { transition: none; } }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; color: var(--ink-soft); }
@media (max-width: 420px) { .facts b { font-size: 1.6rem; } .grid2 { grid-template-columns: 1fr; } }
</style>

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

const answered = (q, v) => (q.opts ? (q.multi ? Array.isArray(v) && (q.multi > 0 ? v.length === q.multi : v.length > 0) : typeof v === "number") : typeof v === "string" && v.trim().length > 0);
const optText = (q, v) => (v == null ? "—" : Array.isArray(v) ? v.map((i) => q.opts[i]).join(", ") : q.opts ? q.opts[v] : v);
const same = (q, a, b) => {
  if (a == null || b == null) return 0;
  if (Array.isArray(a)) { const s = new Set(a); const inter = b.filter((x) => s.has(x)).length; return inter / new Set([...a, ...b]).size; }
  return a === b ? 1 : 0;
};

const S = {

function myStatus() { return S.status[S.me] || {}; }

/* ───────────────────────── data layer ───────────────────────── */
function progressOf(m) {
  const d = S.mine || {};
  const p = {};
  p.m1s = M1.filter((q) => answered(q, d.m1s?.[q.id])).length;
  p.m1g = M1.filter((q) => q.opts && answered(q, d.m1g?.[q.id])).length;
  p.m2 = M2.filter((q) => answered(q, d.m2?.[q.id])).length;
  p.m3 = M3.filter((q) => answered(q, d.m3?.[q.id])).length;
  p.m4 = M4.filter((q) => answered(q, d.m4?.[q.id])).length;
  return m ? p[m] : p;
}
function scheduleSave() {
  if (S.demo || !S.db) return;
  clearTimeout(S.saveTimer);
  S.saving = "Speichert …"; paintSave();
  S.saveTimer = setTimeout(saveNow, 700);
}
async function saveNow() {
  if (S.demo || !S.db) return;
  try {
    await S.db.doc("answers/" + S.me).set(S.mine);
    await S.db.doc("status/" + S.me).set({ name: S.mine.name, done: S.mine.done || {}, prog: progressOf(), stars: S.mine.stars || [] });
    S.saving = "✓ Gespeichert";
  } catch (e) { S.saving = "Nicht gespeichert – Verbindung prüfen"; }
  paintSave();
}
function paintSave() { const el = $("#save"); if (el) el.textContent = S.saving; }

/* The owner's view publishes a module's answers to shared/<module> once BOTH have finished it. */
async function syncShared(force) {
  if (!S.db || !S.owner) return;
  const people = Object.entries(S.status).filter(([, s]) => s.name);
  if (people.length < 2) return;
  for (const m of ["m1", "m2", "m3", "m4"]) {
    const bothDone = people.every(([, s]) => s.done?.[m]);
    if (!bothDone || (S.shared[m] && !force)) continue;
    const data = {};
    for (const [id, s] of people) {
      const snap = await S.db.doc("answers/" + id).get().catch(() => null);
      const a = snap?.exists ? snap.data() : {};
      data[s.name] = m === "m1" ? { self: a.m1s || {}, guess: a.m1g || {} } : m === "m4" ? { a: a.m4 || {}, fin: a.fin || null } : { a: a[m] || {} };
    }
    await S.db.doc("shared/" + m).set({ data, at: new Date().toISOString() }).catch(() => {});
  }
}

async function boot() {
  const c = window.claude;
  const fail = () => { S.view = "nodb"; render(); };
  if (!c?.use) return fail();
  const timer = setTimeout(() => { if (!S.db) fail(); }, 12000);
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return fail();
    const id = await user.id();
    if (!id) return fail();
    S.owner = (await user.isOwner()) ?? false;
    const snap = await db.doc("answers/" + id).get().catch(() => null);
    S.mine = snap?.exists ? snap.data() : { name: null, m1s: {}, m1g: {}, m2: {}, m3: {}, m4: {}, fin: null, done: {}, stars: [] };
    S.db = db; S.me = id;
    clearTimeout(timer);
    db.collection("status").onSnapshot((q) => { const m = {}; q.docs.forEach((d) => (m[d.id] = d.data())); S.status = m; if (S.view === "home" || S.view === "admin" || S.view === "result") render(); syncShared(); });
    ["m1","m2","m3","m4"].forEach((m) => db.doc("shared/" + m).onSnapshot((d) => { S.shared[m] = d.exists ? d.data().data : null; if (S.view === "home" || S.view === "result" || S.view === "report") render(); }));
    S.view = "home"; render();
  } catch (e) { fail(); }
}

  wire();
}
function go(view, extra) { Object.assign(S, extra || {}, { view, err: null }); render(); window.scrollTo({ top: 0 }); }

function finCalc(A, B, rentOverride, incomeFactor = 1) {

}

    const a = d4.Joanna.a, b = d4.Kewin.a, p = movingProfile(a, b);
    const rows = [["Haltung zum Zusammenziehen", "w1"], ["Zeitvorstellung", "w2"], ["Mietaufteilung", "w5"], ["Finanzielles Polster", "w6"], ["Haushalt", "w9"], ["Freiraum", "w11"], ["Was zuerst erreicht werden soll", "w14"]];
    out += sec("04", "Are we ready to move in?", `<div class="card dark stack"><p class="eyebrow">Your profile</p><h2>${p.title}</h2><p class="muted">${p.text}</p><p>${p.verdict}</p></div>
      <div class="stack">${rows.map(([n, id]) => { const q = M4.find((x) => x.id === id); return `<div class="card stack"><p class="eyebrow">${n} ${same(q, a[id], b[id]) === 1 ? '<span class="ok">· gleich</span>' : '<span style="color:var(--warn)">· offen</span>'}</p><div class="cmp"><div><p class="who">Joanna</p>${esc(optText(q, a[id]))}</div><div><p class="who">Kewin</p>${esc(optText(q, b[id]))}</div></div></div>`; }).join("")}</div>
      ${d4.Joanna.fin && d4.Kewin.fin ? `<div class="card stack"><p class="eyebrow">Financial reality check</p>${finBlock(d4.Joanna.fin, d4.Kewin.fin, "Joanna", "Kewin", false)}</div>` : ""}
      <p class="small muted">Diese Profile beschreiben eure Antworten – sie bewerten nicht eure Beziehung.</p>`);
    const diffs = [...(d3 ? M3.filter((q) => q.opts && q.talk && same(q, d3.Joanna.a[q.id], d3.Kewin.a[q.id]) < 1) : []), ...M4.filter((q) => q.opts && q.talk && same(q, a[q.id], b[q.id]) < 1)].map((q) => q.talk);
    const defaults = ["Wie viel Geld möchten wir vor einem gemeinsamen Einzug sparen?", "Welche Mietbelastung wäre für uns beide angenehm?", "Wie viel persönlichen Freiraum brauchen wir?", "Wann wäre ein guter Zeitpunkt für einen gemeinsamen Haushalt?", "Welche beruflichen oder akademischen Ziele möchten wir vorher erreichen?"];
    const topics = [...new Set([...diffs, ...defaults])].slice(0, 5);
    out += sec("05", "Our next conversations", `<ol class="stack" style="padding-left:20px;margin:0">${topics.map((t) => `<li class="quote" style="font-size:1.15rem">${esc(t)}</li>`).join("")}</ol>`);
    out += sec("06", "Our next chapter", `<div class="stack">${roadmap(p.key).map(([t, x]) => `<div class="card"><p class="eyebrow">${t}</p><p>${esc(x)}</p></div>`).join("")}</div><p class="small muted">Ein unverbindliches Beispiel, abgeleitet aus euren Antworten.</p>`);
  }
  out += `<p class="quote" style="text-align:center">“Building a future together doesn’t mean having everything figured out. It means learning how to build it together.”</p>
  <p class="eyebrow" style="text-align:center">Beyond the little things. Beyond the surface. Beyond today.</p>
  <button class="btn link" data-act="home">← Übersicht</button></div>`;
  return out;
}
function viewCalc() {
  const A = S.calcA || EXAMPLE_FIN.A, B = S.calcB || EXAMPLE_FIN.B;
  return `<div class="stack-lg fade"><div class="stack"><p class="eyebrow">Financial reality check</p><h2>What would our home cost?</h2>
  <p class="muted"><strong>Fiktive Beispieldaten</strong> – keine Aussage über eure tatsächliche Situation. Ändert die Werte frei; hier wird nichts gespeichert. Eure echten Angaben macht jeder privat in Modul 04.</p></div>
  <div class="grid2">${["A", "B"].map((p) => `<div class="card stack"><p class="eyebrow">Person ${p}</p>${FIN_FIELDS.map(([k, l]) => `<label class="f" for="c${p}-${k}">${l}<input type="number" inputmode="decimal" min="0" step="10" id="c${p}-${k}" data-calc="${p}" data-k="${k}" value="${(p === "A" ? A : B)[k]}"></label>`).join("")}</div>`).join("")}</div>
  <div id="calc-out">${finBlock(A, B, "Person A", "Person B", true)}</div>
  <button class="btn link" data-act="home">← Übersicht</button></div>`;
}
function viewAdmin() {
  const people = Object.values(S.status).filter((s) => s.name);
  return `<div class="stack-lg fade"><div class="stack"><p class="eyebrow">Admin · nur für dich sichtbar</p><h2>Control room</h2>
  <p class="small muted">Zugang: Jeder nutzt sein eigenes Claude-Konto als privaten Zugang. Teile den Link über das Teilen-Menü (mit Bearbeiten-Rechten), damit Joanna speichern kann.</p></div>
  <div class="card stack"><p class="eyebrow">Fortschritt</p><div class="scroll-x"><table class="tbl"><tr><th></th><th>M1 Ich</th><th>M1 Tipp</th><th>M2</th><th>M3</th><th>M4</th></tr>
  ${people.map((s) => `<tr><td>${esc(s.name)}</td><td>${s.prog?.m1s ?? 0}/20</td><td>${s.prog?.m1g ?? 0}/19${s.done?.m1 ? " ✓" : ""}</td><td>${s.prog?.m2 ?? 0}/10${s.done?.m2 ? " ✓" : ""}</td><td>${s.prog?.m3 ?? 0}/15${s.done?.m3 ? " ✓" : ""}</td><td>${s.prog?.m4 ?? 0}/16${s.done?.m4 ? " ✓" : ""}</td></tr>`).join("") || `<tr><td colspan="6">Noch niemand angemeldet.</td></tr>`}</table></div>
  <p class="small muted">Freigeschaltet: ${["m1","m2","m3","m4"].filter((m) => S.shared[m]).map((m) => MODULES[m].n).join(", ") || "noch nichts"}</p></div>
  <div class="row"><button class="btn" data-act="sync">Ergebnisse freischalten / aktualisieren</button></div>
  <p class="small muted">Ergebnisse werden automatisch freigeschaltet, sobald beide ein Modul abgeschlossen haben und diese Seite bei dir offen ist.</p>
  <div class="card stack"><p class="eyebrow">Neues Spiel</p><p class="small muted">Löscht alle Antworten, Namen und Ergebnisse unwiderruflich.</p>
  ${S.confirm === "reset" ? `<div class="row"><button class="btn" style="background:var(--bad)" data-act="reset">Ja, alles löschen</button><button class="btn link" data-act="unconfirm">Abbrechen</button></div>` : `<div><button class="btn ghost" data-act="ask-reset">Alles zurücksetzen</button></div>`}</div>
  <button class="btn link" data-act="home">← Übersicht</button></div>`;
}

/* ───────────────────────── interactions ───────────────────────── */
function wire() {
  document.querySelectorAll("[data-act]").forEach((el) => el.addEventListener("click", () => act(el.dataset.act, el)));
  const ta = $("#free");
  if (ta) ta.addEventListener("input", () => { store()[currentList()[S.step].id] = ta.value; scheduleSave(); });
  document.querySelectorAll("[data-calc]").forEach((inp) => inp.addEventListener("input", () => {
    const p = inp.dataset.calc;
    const obj = (p === "A" ? (S.calcA ||= { ...EXAMPLE_FIN.A }) : (S.calcB ||= { ...EXAMPLE_FIN.B }));
    obj[inp.dataset.k] = Number(inp.value) || 0;
    $("#calc-out").innerHTML = finBlock(S.calcA || EXAMPLE_FIN.A, S.calcB || EXAMPLE_FIN.B, "Person A", "Person B", true);
    wireWhatIf();
  }));
  wireWhatIf();
}
function wireWhatIf() {
  const r = $("#wi-rent"), i = $("#wi-inc");
  if (!r) return;
  const upd = () => {
    const A = S.calcA || EXAMPLE_FIN.A, B = S.calcB || EXAMPLE_FIN.B;
    const f = 1 + Number(i.value) / 100;
    const x = finCalc(A, B, Number(r.value), f);
    const [col, txt] = ampel(x.housingShare);
    $("#wi-rent-v").textContent = eur(Number(r.value));
    $("#wi-inc-v").textContent = (Number(i.value) > 0 ? "+" : "±") + i.value + " %";
    $("#wi-out").innerHTML = `<span class="flag" style="background:${col}"></span>Wohnkosten ${pct(x.housingShare)} · verfügbar ${eur(x.left)} · nach Sparraten ${eur(x.left - x.savA - x.savB)} · ${esc(txt)}`;
  };
  r.addEventListener("input", upd); i.addEventListener("input", upd); upd();
}
async function act(a, el) {
  const list = S.view === "q" || S.view === "review" ? currentList() : null;
  switch (a) {
    case "demo": return startDemo();
    case "pick": {
      S.mine.name = el.dataset.name;
      if (!S.demo) await saveNow();
      return go("home");
    }
    case "home": return go("home", { confirm: null });
    case "calc": return go("calc");
    case "admin": return go("admin", { confirm: null });
    case "report": return go("report");
    case "open": { const m = el.dataset.mod; return go(S.shared[m] && (myStatus().done?.[m] || S.demo) ? "result" : "intro", { mod: m }); }
    case "result": return go("result");
    case "start": {
      const phase = S.mod === "m1" ? (M1.every((q) => answered(q, S.mine.m1s?.[q.id])) ? "guess" : "self") : null;
      S.phase = phase;
      const l = currentList(); const st = store();
      const first = l.findIndex((q) => !answered(q, st[q.id]));
      return go(first < 0 ? "review" : "q", { step: Math.max(0, first) });
    }
    case "opt": {
      const q = list[S.step], i = Number(el.dataset.i), st = store();
      if (q.multi) { const cur = Array.isArray(st[q.id]) ? st[q.id] : []; st[q.id] = cur.includes(i) ? cur.filter((x) => x !== i) : q.multi > 0 && cur.length >= q.multi ? cur : [...cur, i]; }
      else st[q.id] = i;
      scheduleSave(); render(); return;
    }
    case "star": { const id = list[S.step].id; const s = new Set(S.mine.stars || []); s.has(id) ? s.delete(id) : s.add(id); S.mine.stars = [...s]; scheduleSave(); render(); return; }
    case "next": {
      const q = list[S.step];
      if (!answered(q, store()[q.id])) { S.err = q.multi > 0 ? `Bitte genau ${q.multi} auswählen.` : "Bitte beantworte die Frage, um weiterzugehen."; return render(); }
      return S.step === list.length - 1 ? go("review", { confirm: null }) : go("q", { step: S.step + 1 });
    }
    case "prev": return S.step === 0 ? (S.mod === "m1" && S.phase === "guess" ? go("review", { phase: "self" }) : go("intro")) : go("q", { step: S.step - 1 });
    case "jump": return go("q", { step: Number(el.dataset.i) });
    case "back-q": return go("q", { step: list.length - 1 });
    case "phase2": { S.phase = "guess"; const l = currentList(); const first = l.findIndex((q) => !answered(q, S.mine.m1g?.[q.id])); return go(first < 0 ? "review" : "q", { step: Math.max(0, first) }); }
    case "confirm": return go("review", { confirm: true });
    case "unconfirm": S.confirm = null; return render();
    case "submit": {
      if (S.mod === "m1" && !M1.every((q) => answered(q, S.mine.m1s?.[q.id]))) return go("review", { phase: "self" });
      S.mine.done = { ...(S.mine.done || {}), [S.mod]: true };
      if (S.demo) { demoShare(S.mod); return go("result"); }
      await saveNow(); syncShared();
      return go("intro", { confirm: null });
    }
    case "finin": return go("fin");
    case "back-review": return go("review");
    case "finsave": {
      const f = {}; document.querySelectorAll("[data-fin]").forEach((i) => (f[i.dataset.fin] = Number(i.value) || 0));
      S.mine.fin = f; scheduleSave(); return go("review");
    }
    case "sync": await syncShared(true); return render();
    case "ask-reset": S.confirm = "reset"; return render();
    case "reset": {
      try {
        for (const col of ["answers", "status", "shared"]) { const q = await S.db.collection(col).get(); for (const d of q.docs) await S.db.doc(col + "/" + d.id).delete(); }
      } catch (e) {}
      S.mine = { name: null, m1s: {}, m1g: {}, m2: {}, m3: {}, m4: {}, fin: null, done: {}, stars: [] }; S.shared = {};
      return go("who", { confirm: null });
    }
  }
}

/* ───────────────────────── demo (example data only) ───────────────────────── */
function demoAnswers(seed) {
  const r = (i, n) => (i * 7 + seed * 3) % n;
  const self = {}, guess = {}, m2 = {}, m3 = {}, m4 = {};
  M1.forEach((q, i) => { if (q.opts) { self[q.id] = r(i, q.opts.length); guess[q.id] = (i % 3 === 0 ? r(i + 1, q.opts.length) : r(i, q.opts.length + seed) % q.opts.length); } else self[q.id] = seed ? "Dass ich oft mehr fühle, als ich zeige. (Beispiel)" : "Dass ich Zeit brauche, um mich zu öffnen. (Beispiel)"; });
  M2.forEach((q) => (m2[q.id] = "Beispielantwort – in der echten Experience steht hier eure eigene Antwort."));
  M3.forEach((q, i) => (m3[q.id] = q.opts ? (q.multi ? [0, 1 + seed, 3 + seed].slice(0, 3) : (i % 2 ? r(i, q.opts.length) : 0)) : "Ein Zuhause voller Lachen. (Beispiel)"));
  M4.forEach((q, i) => (m4[q.id] = q.opts ? (q.multi ? [0, 1, 2 + seed] : (i % 3 ? r(i, q.opts.length) : seed)) : "Hell, gemütlich, mit Balkon. (Beispiel)"));
  return { self, guess, m2, m3, m4 };
}
function demoShare(m) {
  const J = demoAnswers(0), K = demoAnswers(1);
  // Example guesses: right about two thirds of the time.
  M1.forEach((q, i) => { if (!q.opts) return; const n = q.opts.length; J.guess[q.id] = i % 3 === 0 ? (K.self[q.id] + 1) % n : K.self[q.id]; K.guess[q.id] = i % 4 === 1 ? (J.self[q.id] + 2) % n : J.self[q.id]; });
  const data = { m1: { Joanna: { self: J.self, guess: J.guess }, Kewin: { self: K.self, guess: K.guess } }, m2: { Joanna: { a: J.m2 }, Kewin: { a: K.m2 } }, m3: { Joanna: { a: J.m3 }, Kewin: { a: K.m3 } }, m4: { Joanna: { a: J.m4, fin: EXAMPLE_FIN.A }, Kewin: { a: K.m4, fin: EXAMPLE_FIN.B } } };
  if (m) S.shared[m] = data[m]; else S.shared = data;
}
function startDemo() {
  S.demo = true; S.owner = false;
  S.mine = { name: "Kewin", m1s: {}, m1g: {}, m2: {}, m3: {}, m4: {}, fin: null, done: { m1: true, m2: true, m3: true, m4: true }, stars: [] };
  demoShare(); go("home");
}

boot();
</script>
