name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Database migrations & RLS
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Stripe webhook integration
        run: npm run test:stripe
      - name: End-to-end
        run: |
          npm run owner:create -- --email owner@one.test --password "OwnerPass123" | tee owner.txt
          OWNER_ID=$(grep -o 'ONE_OWNER_USER_ID=.*' owner.txt | cut -d= -f2)
          cat > .env.local <<ENV
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          ONE_SESSION_SECRET=$(openssl rand -base64 48)
          ONE_OWNER_USER_ID=$OWNER_ID
          ONE_LOG_DEMO_MAIL=true
          ENV
          npx next start -p 3000 > server.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000
          SERVER_LOG=server.log npm run test:e2e
          # fresh server for the business suite (sign-up rate limits are per IP)
          kill %1 || true; sleep 2
          npx next start -p 3000 > server2.log 2>&1 &
          npx wait-on -t 60000 http://localhost:3000
          npm run test:e2e:business
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/screenshots
          if-no-files-found: ignore
