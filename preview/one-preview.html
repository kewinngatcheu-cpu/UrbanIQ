<title>ONE Vorschau</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first app shell (sticky top bar, fixed bottom tabs, sheets), max 680px centered.
   ONE is a deliberately light product (brand rule), so the page commits to one light look with explicit colors. */
:root {
  --white: #ffffff; --snow: #f8fbff; --mist: #eff7ff; --sky: #dceeff; --cloud: #bbdfff;
  --primary: #6aafe8; --accent: #438ed4; --accent-ink: #2f74b5;
  --ink: #23364d; --muted: #66758a; --line: #e6edf5; --fog: #f3f6fa;
  --mint: #e8f8f1; --mint-ink: #1f7a55; --lav: #f0edff; --lav-ink: #5b4bb7;
  --peach: #fff4ec; --peach-ink: #b4572a; --rose: #fff0f1; --rose-ink: #b42339;
  --shadow: 0 1px 2px rgba(35,54,77,.04), 0 4px 16px rgba(35,54,77,.05);
  --glow: 0 0 0 1px rgba(106,175,232,.25), 0 10px 40px rgba(106,175,232,.22);
  --font: "Geist", -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--white); color: var(--ink); }
body { font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--white); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 10px; }
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; letter-spacing: .18em; font-size: 16px; background: none; border: 0; padding: 0; }
.logo svg { width: 26px; height: 26px; }
.badge { font-size: 9.5px; font-weight: 600; letter-spacing: .14em; border-radius: 999px; padding: 3px 7px; background: var(--mist); color: var(--accent-ink); }
.badge.dark { background: var(--ink); color: var(--white); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--white); }
.lang button { border: 0; background: none; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--white); }
.top-right { display: flex; align-items: center; gap: 8px; }
.ctx { font-size: 12px; color: var(--muted); margin-top: -6px; padding-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctx select { border: 1px solid var(--line); border-radius: 8px; background: var(--white); padding: 2px 6px; font-size: 12px; }

main { padding-block: 18px 120px; }
.note { display: flex; gap: 8px; font-size: 12.5px; line-height: 1.45; color: var(--lav-ink); background: var(--lav); border: 1px dashed #d9d1ff; border-radius: 12px; padding: 9px 12px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .row { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 9px; font-size: 10.5px; color: var(--muted); min-width: 0; }
.tabs button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); }

.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--accent-ink); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.h-page { font-size: 26px; font-weight: 600; line-height: 1.15; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.card { background: var(--white); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.card h3 { font-size: 15px; font-weight: 600; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.link { color: var(--accent-ink); font-weight: 500; font-size: 13px; background: none; border: 0; padding: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 10px 15px; font-weight: 500; font-size: 14.5px; background: var(--accent); color: var(--white); box-shadow: 0 6px 20px -6px rgba(67,142,212,.6); }
.btn.secondary { background: var(--white); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }
.btn.soft { background: var(--mist); color: var(--accent-ink); box-shadow: none; }
.btn.ghost { background: none; color: var(--muted); box-shadow: none; }
.btn.danger { background: var(--rose); color: var(--rose-ink); box-shadow: none; }
.btn.sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 500; background: var(--mist); color: var(--accent-ink); white-space: nowrap; }
.chip.gray { background: var(--fog); color: var(--muted); }
.chip.peach { background: var(--peach); color: var(--peach-ink); }
.chip.lav { background: var(--lav); color: var(--lav-ink); }
.chip.mint { background: var(--mint); color: var(--mint-ink); }
.chip.rose { background: var(--rose); color: var(--rose-ink); }
.chip.ink { background: var(--ink); color: var(--white); }
.empty { text-align: center; padding: 20px 12px; border: 1px dashed var(--cloud); border-radius: 14px; background: var(--snow); color: var(--muted); font-size: 13.5px; }
.lock { font-size: 12.5px; color: var(--peach-ink); background: var(--peach); border-radius: 10px; padding: 8px 11px; }
.ok { font-size: 13.5px; color: var(--mint-ink); background: var(--mint); border-radius: 12px; padding: 9px 12px; }

label.lbl { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.field { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--white); padding: 10px 12px; font-size: 16px; min-width: 0; }
.field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(220,238,255,.8); }
textarea.field { min-height: 90px; resize: vertical; line-height: 1.5; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }

.hero { text-align: center; padding-block: 14px 4px; }
.hero h1 { font-size: 38px; line-height: 1.06; font-weight: 600; letter-spacing: -0.035em; }
.hero h1 .grad { background: linear-gradient(120deg, var(--ink) 5%, var(--accent) 60%, var(--primary) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin-top: 12px; color: var(--muted); font-size: 15.5px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--sky); background: var(--white); color: var(--accent-ink); font-size: 12px; font-weight: 500; border-radius: 999px; padding: 5px 12px; box-shadow: var(--shadow); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.world { display: flex; flex-direction: column; gap: 6px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 22px; padding: 18px; background: linear-gradient(160deg, var(--white), var(--mist)); box-shadow: var(--shadow); }
.world.biz { background: linear-gradient(160deg, var(--white), var(--fog)); }
.world .ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--mist); color: var(--accent); }
.world.biz .ic { background: var(--ink); color: var(--white); }
.world .ic svg { width: 20px; height: 20px; }
.world b { font-size: 19px; letter-spacing: -0.02em; }
.world ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13px; }
.world li::before { content: "✓ "; color: var(--accent); font-weight: 600; }
.world .go { margin-top: 8px; color: var(--accent-ink); font-weight: 500; font-size: 14px; }
.adminlink { width: 100%; border: 1px dashed var(--cloud); border-radius: 16px; background: var(--snow); padding: 12px 14px; display: flex; gap: 10px; align-items: center; text-align: left; font-size: 13.5px; }

.composer { border: 1px solid var(--cloud); border-radius: 22px; background: var(--white); box-shadow: var(--glow); padding: 8px; }
.composer textarea { border: 0; width: 100%; resize: none; padding: 8px 10px 4px; font-size: 16px; min-height: 50px; background: transparent; line-height: 1.45; }
.composer textarea:focus { outline: none; }
.composer .bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button { border: 0; background: none; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--mist); color: var(--accent-ink); font-weight: 500; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--white); display: grid; place-items: center; flex-shrink: 0; }
.send svg { width: 18px; height: 18px; }
.answer { border: 1px solid var(--line); background: var(--snow); border-radius: 16px; padding: 14px; font-size: 14.5px; }
.answer ol { margin: 8px 0 0; padding-left: 20px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: var(--white); box-shadow: var(--shadow); text-align: left; min-width: 0; }
.tile .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
.tile .ic svg { width: 18px; height: 18px; }
.tile b { display: block; font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span span { font-size: 12px; color: var(--muted); }

.item { display: flex; align-items: flex-start; gap: 11px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item.sub { padding-left: 26px; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--cloud); background: var(--white); flex-shrink: 0; display: grid; place-items: center; padding: 0; margin-top: 1px; }
.check.done { background: var(--mint-ink); border-color: var(--mint-ink); color: var(--white); }
.check:disabled { opacity: .45; cursor: not-allowed; }
.check svg { width: 12px; height: 12px; }
.main-col { min-width: 0; flex: 1; }
.main-col .t { font-size: 14.5px; overflow-wrap: anywhere; }
.main-col .t.done { text-decoration: line-through; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); align-items: center; }
.overdue { color: var(--rose-ink); }
.iconbtn { border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 8px; font-size: 16px; line-height: 1; }
.entry { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--white); box-shadow: var(--shadow); }
.entry .k { font-size: 12px; color: var(--muted); }
.entry b { display: block; margin-top: 3px; font-size: 15px; overflow-wrap: anywhere; }
.entry p { margin-top: 4px; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.entry .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }

.insight { border-radius: 14px; padding: 12px 14px; }
.insight.attention { background: var(--peach); }
.insight.info { background: var(--snow); border: 1px solid var(--line); }
.insight.positive { background: var(--mint); }
.insight .row { gap: 6px; }
.insight b { font-size: 14px; }
.insight p { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
.cert { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 2px 8px; }
.cert.fact { background: var(--mint); color: var(--mint-ink); border: 1px solid #bfe9d4; }
.cert.inf { background: var(--lav); color: var(--lav-ink); border: 1px solid #ddd6ff; }
.sources { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
.sources .lab { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.src { border: 1px solid var(--line); background: var(--white); border-radius: 999px; padding: 3px 9px; font-size: 12px; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.seg { display: flex; gap: 4px; background: var(--fog); border-radius: 14px; padding: 4px; overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: none; padding: 7px 11px; border-radius: 10px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 500; box-shadow: var(--shadow); }
.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.type { border: 1px solid var(--line); border-radius: 14px; padding: 10px 11px; text-align: left; background: var(--white); min-width: 0; }
.type[aria-pressed="true"] { border-color: var(--primary); background: var(--mist); box-shadow: 0 0 0 3px rgba(187,223,255,.6); }
.type b { display: block; font-size: 13px; }
.type span { font-size: 11.5px; color: var(--muted); }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; width: 100%; text-align: left; background: none; border: 0; }
.step .n { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--cloud); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--accent); flex-shrink: 0; }
.step.done .n { background: var(--mint-ink); border-color: var(--mint-ink); color: var(--white); }
.step.done span:last-child { text-decoration: line-through; color: var(--muted); }
.progress { height: 6px; background: var(--fog); border-radius: 99px; overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 99px; }
pre.draft { white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; background: var(--snow); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 0; max-height: 300px; overflow: auto; }
.status { display: flex; gap: 4px; flex-wrap: wrap; background: var(--fog); border-radius: 14px; padding: 4px; }
.status button { border: 0; background: none; padding: 6px 9px; border-radius: 10px; font-size: 12px; color: var(--muted); }
.status button[aria-pressed="true"] { background: var(--white); color: var(--ink); font-weight: 500; box-shadow: var(--shadow); }
.board { display: grid; gap: 10px; }
.col { background: var(--snow); border-radius: 14px; padding: 10px; }
.col h4 { margin: 0 0 6px; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.col h4 .dot { width: 8px; height: 8px; border-radius: 50%; }
.mini { display: block; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; background: var(--white); padding: 9px 11px; margin-top: 6px; font-size: 13.5px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--line); display: grid; gap: 10px; }
.timeline li { position: relative; font-size: 13px; }
.timeline li::before { content: ""; position: absolute; left: -19px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.timeline small { display: block; color: var(--muted); font-size: 11.5px; }
.stat { border: 1px solid var(--line); border-radius: 16px; padding: 13px; background: var(--white); box-shadow: var(--shadow); min-width: 0; }
.stat p { font-size: 12px; color: var(--muted); }
.stat b { display: block; font-size: 24px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat small { font-size: 11.5px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl td, .tbl th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
.scroll-x { overflow-x: auto; }
.link-box { display: flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 12px; background: var(--snow); padding: 6px; }
.link-box code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 12px; padding: 0 6px; }

.sheet-bg { position: fixed; inset: 0; background: rgba(35,54,77,.24); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--white); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(35,54,77,.15); max-height: 88vh; overflow-y: auto; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
.sheet .wrap { padding-block: 10px 0; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.morebtn { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--white); padding: 12px; font-size: 14px; text-align: left; }
.morebtn svg { width: 18px; height: 18px; color: var(--accent); flex-shrink: 0; }

@media (min-width: 700px) {
  .hero h1 { font-size: 52px; }
  .tiles { grid-template-columns: repeat(4, 1fr); }
  .board { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .worlds { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .view { animation: up .3s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes up { from { opacity: .5; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="row" style="gap:8px;flex-wrap:nowrap">
      <button class="logo" id="logo" aria-label="ONE – Start">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="#EFF7FF"/><circle cx="16" cy="16" r="8.2" fill="none" stroke="#6AAFE8" stroke-width="3.2"/><circle cx="22.4" cy="9.6" r="2.6" fill="#438ED4" stroke="#EFF7FF" stroke-width="1.4"/></svg>

      </button>
      <span id="worldbadge"></span>

<script>
(function () {
  "use strict";
  /* ───────── basics ───────── */
  var lang = "de";
  var L = function (de, en) { return lang === "de" ? de : en; };
  var KEY = "one-preview-v2";
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var uid = function () { return Math.random().toString(36).slice(2, 10); };
  var dk = function (d) { var x = new Date(d); return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0"); };
  var plus = function (n) { var d = new Date(); d.setDate(d.getDate() + n); return dk(d); };
  var TODAY = dk(new Date());
  var loc = function () { return lang === "de" ? "de-DE" : "en-GB"; };
  var fmt = function (k, o) { return new Date(k + "T12:00:00").toLocaleDateString(loc(), o || { day: "numeric", month: "short" }); };
  var due = function (k) { if (!k) return L("Ohne Datum", "No date"); if (k === TODAY) return L("Heute", "Today"); if (k === plus(1)) return L("Morgen", "Tomorrow"); if (k === plus(-1)) return L("Gestern", "Yesterday"); return fmt(k, { weekday: "short", day: "numeric", month: "short" }); };
  var ago = function (ts) { var m = Math.round((Date.now() - ts) / 60000); if (m < 1) return L("gerade eben", "just now"); if (m < 60) return L("vor " + m + " Min.", m + " min ago"); var h = Math.round(m / 60); if (h < 24) return L("vor " + h + " Std.", h + " h ago"); return L("vor " + Math.round(h / 24) + " T.", Math.round(h / 24) + " d ago"); };

    if (d.findtasks) { var doc = S.B.docs.find(function (x) { return x.id === d.findtasks; }); var m3 = doc.content.match(/(\d+)\s*(Monat|month)/i); S.B.tasks.push({ id: uid(), title: L("Kündigungsfrist prüfen: " + doc.title, "Check notice period: " + doc.title) + (m3 ? " (" + m3[0] + ")" : ""), project: doc.project, assignee: meId(), prio: "high", due: plus(30), done: false, parent: null, source: doc.id }); logB(L("1 Aufgabe wurde aus „" + doc.title + "“ erstellt", "1 task was created from “" + doc.title + "”"), doc.project); ui.toast = ""; render(); return; }
    if (d.revoke) { S.B.invites = S.B.invites.filter(function (i) { return i.id !== d.revoke; }); ui.inviteLink = null; render(); return; }
    if (el.id === "copyinv") { var lk = document.getElementById("ilink").textContent; try { navigator.clipboard.writeText(lk).then(function () { el.textContent = L("Kopiert", "Copied"); }, function () { selectText("ilink"); }); } catch (x) { selectText("ilink"); } return; }
    if (d.buy) { ui.sheet = "buy:" + d.buy; renderSheet(); return; }
    if (el.id === "confirmbuy") { S.B.plan = el.dataset.plan; audit("subscription.plan_changed → " + el.dataset.plan + " (demo)"); logB(L("Tarif " + S.plans[S.B.plan].name + " wurde gebucht (Demo)", "Plan " + S.plans[S.B.plan].name + " was booked (demo)")); ui.sheet = null; render(); return; }
    // admin
    if (d.admintab) { ui.adminTab = d.admintab; render(); return; }
    if (d.req) { var r = S.requests.find(function (x) { return x.id === d.req; }); r.status = d.dec; audit(d.dec === "approved" ? "admin.account_type_approved" : "admin.account_type_rejected"); render(); return; }
    if (el.id === "mfa") { S.mfa = !S.mfa; audit(S.mfa ? "admin.mfa_enabled" : "admin.mfa_disabled"); render(); return; }
  });
  function selectText(id) { var n = document.getElementById(id); if (!n) return; var r = document.createRange(); r.selectNodeContents(n); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.id === "rolesel") { S.B.role = el.value; S.B.members[0].role = el.value === "owner" ? "owner" : el.value; if (el.value !== "owner") S.B.members[0].role = el.value; ui.inviteLink = null; render(); return; }
    if (el.dataset.role) { var m = S.B.members.find(function (x) { return x.id === el.dataset.role; }); var old = m.role; m.role = el.value; logB(L("Rolle von " + m.name + ": " + ROLE(old) + " → " + ROLE(m.role), m.name + "'s role: " + ROLE(old) + " → " + ROLE(m.role))); render(); return; }
    if (el.id === "plead" || el.id === "pstage") { var p = S.B.projects.find(function (x) { return x.id === el.dataset.pid; }); if (el.id === "plead") { p.lead = el.value || null; logB(L("Verantwortung für „" + p.name + "“: " + memberName(p.lead), "Responsible for “" + p.name + "”: " + memberName(p.lead)), p.id); } else { p.stage = el.value; logB(L("Projekt „" + p.name + "“ ist jetzt " + stageLabel(p.stage), "Project “" + p.name + "” is now " + stageLabel(p.stage)), p.id); } render(); return; }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "q") { ui.q = e.target.value; var pos = e.target.selectionStart; render(); var q = document.getElementById("q"); q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) {} }
  });
  document.addEventListener("keydown", function (e) {
    if (e.target.id === "cin" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("composer").requestSubmit(); }
    if (e.key === "Escape" && ui.sheet) { ui.sheet = null; renderSheet(); }
  });
  document.addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target, v = function (id) { var n = document.getElementById(id); return n ? n.value.trim() : ""; };
    var biz = S.world === "business";
    if (f.id === "composer") {
      var text = v("cin"); if (!text) return;
      if (ui.mode === "ask") { ui.answer = { q: text, hits: biz ? search(S.B.docs.concat(S.B.projects.map(function (p) { return { title: p.name, content: p.desc }; })), text) : search(S.P.memories.concat(S.P.tasks.map(function (t) { return { title: t.title, content: due(t.due) }; })), text) }; ui.toast = ""; }
      else if (ui.mode === "remember") {
        if (biz && !can("write")) { ui.toast = L("Als Betrachter kannst du nichts speichern.", "As a viewer you can't save."); }
        else if (biz) { S.B.docs.push({ id: uid(), kind: "info", title: text.split("\n")[0].slice(0, 80), content: text, client: null, project: null, at: Date.now() }); logB(L("„" + text.slice(0, 40) + "“ wurde dem Firmenwissen hinzugefügt", "“" + text.slice(0, 40) + "” was added to company memory")); ui.toast = L("Im Firmenwissen gespeichert.", "Saved to company memory."); }
        else { S.P.memories.push({ id: uid(), title: text.split("\n")[0].replace(/#\S+/g, "").trim().slice(0, 80) || text.slice(0, 40), content: text, tags: (text.match(/#([\wäöüß-]+)/gi) || []).map(function (x) { return x.slice(1).toLowerCase(); }), at: Date.now() }); ui.toast = L("In Memory gespeichert.", "Saved to Memory."); }
        ui.answer = null;
      } else {
        if (biz && !can("tasks.create")) { ui.toast = L("Als Betrachter kannst du keine Aufgaben anlegen.", "As a viewer you can't create tasks."); }
        else if (biz) { S.B.tasks.push({ id: uid(), title: text.slice(0, 120), project: null, assignee: meId(), prio: "normal", due: null, done: false, parent: null }); logB(L("Aufgabe „" + text.slice(0, 40) + "“ wurde angelegt", "Task “" + text.slice(0, 40) + "” was created")); ui.toast = L("Aufgabe hinzugefügt.", "Task added."); }
        else { S.P.tasks.push({ id: uid(), title: text.slice(0, 120), kind: "task", due: TODAY, done: false }); ui.toast = L("Aufgabe zu Life hinzugefügt.", "Task added to Life."); }
        ui.answer = null;
      }
      render(); return;
    }
    if (f.id === "actform") {
      var type = biz ? ui.btype : ui.ptype, title = v("atitle"), desc = v("adesc"); if (!title) return;
      var miss = (type === "cancellation" && !/\d{4,}/.test(desc)) ? [L("Kunden- oder Vertragsnummer", "Customer or contract number")] : type === "offer" && !/\d/.test(desc) ? [L("Preis oder Stundensatz", "Price or hourly rate")] : [];
      var a = { id: uid(), type: type, title: title, status: miss.length ? "waiting" : "new", steps: stepsFor(type).map(function (s) { return { t: s, d: false }; }), draft: draftFor(type, title, desc), missing: miss, at: Date.now() };
      curWorldData().actions.push(a); if (biz) logB(L("Vorgang „" + title + "“ wurde gestartet", "Action “" + title + "” was started"));
      ui.open = a.id; render(); window.scrollTo(0, 0); return;
    }
    if (f.id === "taskform") { var tt = v("ttitle"); if (!tt) return; S.P.tasks.push({ id: uid(), title: tt, kind: v("tkind"), due: v("tdate") || null, done: false }); render(); return; }
    if (f.id === "memform") {
      var mt = v("mtitle"); if (!mt) return;
      if (ui.sheet === "newdoc") { S.B.docs.push({ id: uid(), kind: v("mkind"), title: mt, content: v("mcontent"), client: v("mclient") || null, project: v("mproject") || null, at: Date.now() }); logB(L("„" + mt + "“ wurde dem Firmenwissen hinzugefügt", "“" + mt + "” was added to company memory"), v("mproject") || null); }
      else S.P.memories.push({ id: uid(), title: mt, content: v("mcontent"), tags: v("mtags").split(",").map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean), at: Date.now() });
      ui.sheet = null; render(); return;
    }
    if (f.id === "btaskform") {
      var bt = v("bttitle"); if (!bt) return;
      var parent = f.dataset.parent || null;
      var ass = can("tasks.manage") ? v("btass") : meId();
      S.B.tasks.push({ id: uid(), title: bt, project: v("btproj") || null, assignee: ass, prio: v("btprio"), due: v("btdate") || null, done: false, parent: parent });
      logB(L("Aufgabe „" + bt + "“ wurde angelegt" + (ass !== meId() ? " und zugewiesen" : ""), "Task “" + bt + "” was created" + (ass !== meId() ? " and assigned" : "")), v("btproj") || null);
      ui.sheet = null; render(); return;
    }
    if (f.id === "projform") { var pn = v("pjname"); if (!pn) return; var p = { id: uid(), name: pn, desc: v("pjdesc"), stage: "planned", lead: v("pjlead") || null, client: null, due: v("pjdue") || null, archived: false }; S.B.projects.push(p); logB(L("Projekt „" + pn + "“ wurde angelegt", "Project “" + pn + "” was created"), p.id); ui.sheet = null; ui.open = p.id; render(); return; }
    if (f.id === "clientform") { var cn = v("cname"); if (!cn) return; S.B.clients.push({ id: uid(), name: cn }); logB(L("Kunde „" + cn + "“ wurde angelegt", "Client “" + cn + "” was added")); render(); return; }
    if (f.id === "inviteform") { var em = v("iemail"); if (!em) return; var role = v("irole"); var tok = Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); S.B.invites.push({ id: uid(), email: em, role: role }); ui.inviteLink = "https://one.app/invite/" + tok; logB(L(em + " wurde als " + ROLE(role) + " eingeladen", em + " was invited as " + ROLE(role))); render(); return; }
    if (f.dataset.planform) {
      var k = f.dataset.planform, raw = v("pp-" + k).replace(",", "."), price = raw === "" ? null : Number(raw);
      if (price !== null && (isNaN(price) || price < 0)) { return; }
      S.plans[k].price = price === null ? null : Math.round(price * 100) / 100; S.plans[k].ai = Math.max(0, parseInt(v("pa-" + k), 10) || 0); S.plans[k].active = document.getElementById("pact-" + k).checked;
      audit("admin.plan_config_changed · " + k + " · " + eur(S.plans[k].price)); render(); return;
    }
  });

  render();
})();
</script>
