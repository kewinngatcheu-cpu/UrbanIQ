* { box-sizing: border-box; }

p { margin: 0; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */

.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; gap: 12px; }

.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--white); }

.lang button[aria-pressed="true"] { background: var(--accent); color: var(--white); }

.preview-note { margin-top: 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; color: var(--lav-ink); background: var(--lav); border: 1px dashed #d9d1ff; border-radius: 12px; padding: 9px 12px; }

main { padding-block: 18px 120px; }

.tabs .row { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }

.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* typography & common */

.card h3 { font-size: 15px; font-weight: 600; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }

.btn.secondary { background: var(--white); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); }

.btn.ghost { background: none; color: var(--muted); box-shadow: none; }

.chip.gray { background: var(--fog); color: var(--muted); }
.chip.peach { background: var(--peach); color: var(--peach-ink); }
.chip.lav { background: var(--lav); color: var(--lav-ink); }
.chip.mint { background: var(--mint); color: var(--mint-ink); }
.chip.rose { background: var(--rose); color: var(--rose-ink); }
.empty { text-align: center; padding: 22px 12px; border: 1px dashed var(--cloud); border-radius: 14px; background: var(--snow); color: var(--muted); font-size: 13.5px; }

label.lbl { display: block; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
.field { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--white); padding: 11px 13px; font-size: 16px; }
.field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(220,238,255,.8); }
textarea.field { min-height: 110px; resize: vertical; line-height: 1.5; }

/* landing */
.hero { text-align: center; padding-block: 18px 6px; }
.hero h1 { font-size: 38px; line-height: 1.05; font-weight: 600; letter-spacing: -0.035em; }
.hero h1 .grad { background: linear-gradient(120deg, var(--ink) 10%, var(--accent) 60%, var(--primary) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin-top: 14px; color: var(--muted); font-size: 16px; }
.pill { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--sky); background: var(--white); color: var(--accent-ink); font-size: 12px; font-weight: 500; border-radius: 999px; padding: 5px 12px; box-shadow: var(--shadow); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); }
.modules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.module { border: 1px solid var(--line); border-radius: 16px; padding: 14px; background: var(--white); text-align: left; }
.module .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 10px; }
.module .ic svg { width: 18px; height: 18px; }
.module b { display: block; font-size: 14px; }
.module span { font-size: 12.5px; color: var(--muted); }
.glowbg { background: radial-gradient(600px 260px at 50% 0%, #eaf4ff 0%, rgba(255,255,255,0) 70%); }

/* composer */
.composer { border: 1px solid var(--cloud); border-radius: 22px; background: var(--white); box-shadow: var(--glow); padding: 8px; }
.composer textarea { border: 0; width: 100%; resize: none; padding: 8px 10px 4px; font-size: 16px; min-height: 52px; background: transparent; line-height: 1.45; }
.composer textarea:focus { outline: none; }
.composer .bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 2px 2px 0; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button { border: 0; background: none; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--mist); color: var(--accent-ink); font-weight: 500; }
.send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: var(--white); display: grid; place-items: center; flex-shrink: 0; }
.send:disabled { background: var(--sky); }
.send svg { width: 18px; height: 18px; }
.answer { margin-top: 12px; border: 1px solid var(--line); background: var(--snow); border-radius: 16px; padding: 14px; font-size: 14.5px; }
.answer ol { margin: 8px 0 0; padding-left: 20px; }
.answer li { margin: 4px 0; }
.toast { margin-top: 10px; background: var(--mint); color: var(--mint-ink); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 16px; padding: 12px; background: var(--white); box-shadow: var(--shadow); text-align: left; }
.tile .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }

.tile b { display: block; font-size: 19px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--muted); }

.seg { display: flex; gap: 4px; background: var(--fog); border-radius: 14px; padding: 4px; overflow-x: auto; }

.dot { display: block; height: 5px; border-radius: 4px; margin: 3px 2px 0; background: var(--primary); }
.dot.deadline { background: #e8a26a; }
.dot.appointment { background: #8b7fe0; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--white); border-radius: 22px 22px 0 0; box-shadow: 0 -10px 40px rgba(35,54,77,.15); max-height: 88vh; overflow-y: auto; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

      '<div class="card"><div class="card-head"><h3>' + t("recent") + '</h3><button class="link" data-go="memory">' + t("all") + "</button></div>" +
      recent.map(function (m) { return '<div class="row-item"><div class="row-main"><div class="t">' + esc(m.title) + '</div><div class="row-meta">' + esc(m.content.slice(0, 70)) + " " + exChip(m) + "</div></div></div>"; }).join("") + "</div>" +
      '<div class="card"><h3>' + t("fullApp") + '</h3><p class="small muted" style="margin-top:4px">' + t("fullAppP") + '</p><button class="btn ghost" id="reset" style="margin-top:8px;padding-left:0">' + t("reset") + "</button><div id=\"reset-confirm\"></div></div>" +
      "</div>";
  }

  function insightHtml(i) {
    return '<div class="insight ' + i.tone + '"><b>' + esc(i.title) + "</b><p>" + esc(i.body) + "</p>" + srcChips(i.src) +
      (i.go ? '<button class="link" style="margin-top:6px" data-go="' + i.go + '">' + t("review") + " →</button>" : "") + "</div>";
  }

  function vMemory() {
    var list = ui.memQ ? searchMem(ui.memQ).concat(state.memories.filter(function (m) { return (m.title + m.content).toLowerCase().indexOf(ui.memQ.toLowerCase()) >= 0; })) : state.memories.slice();
    list = list.filter(function (m, i, a) { return a.indexOf(m) === i; }).sort(function (a, b) { return ui.memQ ? 0 : b.at - a.at; });
    return '<div class="stack"><div><h1 class="h-page">' + t("memory") + '</h1><p class="muted" style="margin-top:2px">' + t("memSub") + "</p></div>" +
      '<div style="display:flex;gap:8px"><input class="field" id="memq" type="search" placeholder="' + t("search") + '" aria-label="' + t("search") + '" value="' + esc(ui.memQ) + '"><button class="btn" id="newmem" style="flex-shrink:0">+</button></div>' +
      (list.length ? list.map(function (m) {
        return '<button class="mem" data-mem="' + m.id + '"><span class="k">' + new Date(m.at).toLocaleDateString(lang === "de" ? "de-DE" : "en-GB", { day: "numeric", month: "short" }) + "</span><b>" + esc(m.title) + "</b><p>" + esc(m.content) + '</p><span class="tags">' +
          m.tags.map(function (tg) { return '<span class="chip">#' + esc(tg) + "</span>"; }).join("") + exChip(m) + "</span></button>";
      }).join("") : '<div class="empty">' + (ui.memQ ? t("noResults") : t("emptyMem")) + "</div>") + "</div>";
  }

  function vAction() {
    var keys = Object.keys(TYPES);
    var acts = state.actions.slice().reverse();
    return '<div class="stack"><div><h1 class="h-page">' + t("action") + '</h1><p class="muted" style="margin-top:2px">' + t("actSub") + "</p></div>" +
      '<form class="card stack" id="actform"><h3>' + t("whatNeed") + '</h3><div class="types" role="group">' +
      keys.map(function (k) { return '<button type="button" class="type" data-type="' + k + '" aria-pressed="' + (ui.actionType === k) + '"><b>' + TYPES[k][lang][0] + "</b><span>" + TYPES[k][lang][1] + "</span></button>"; }).join("") +
      '</div><div><label class="lbl" for="atitle">' + t("title") + '</label><input class="field" id="atitle" required maxlength="120" placeholder="' + (lang === "de" ? "z. B. FitLife-Mitgliedschaft kündigen" : "e.g. Cancel my FitLife membership") + '"></div>' +
      '<div><label class="lbl" for="adesc">' + t("details") + '</label><textarea class="field" id="adesc" placeholder="' + t("detailsPh") + '"></textarea></div>' +
      '<button class="btn block" type="submit">' + t("prepare") + "</button></form>" +
      (acts.length ? acts.map(actionCard).join("") : '<div class="empty">' + t("noActions") + "</div>") + "</div>";
  }

  function actionCard(a) {
    var done = a.steps.filter(function (s) { return s.done; }).length;
    var tone = { new: "", in_progress: "lav", waiting: "peach", done: "mint" }[a.status];
    var expanded = ui.openAction === a.id;
    var html = '<div class="card stack" style="gap:10px"><button style="all:unset;cursor:pointer;display:block" data-act="' + a.id + '"><span class="small muted">' + TYPES[a.type][lang][0] + '</span><div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:2px"><b>' + esc(a.title) + '</b><span class="chip ' + tone + '">' + t("st_" + a.status) + '</span></div><div style="display:flex;gap:8px;align-items:center;margin-top:8px"><div class="progress" style="flex:1"><i style="width:' + (a.steps.length ? done / a.steps.length * 100 : 0) + '%"></i></div><span class="small muted">' + done + "/" + a.steps.length + "</span></div></button>";
    if (expanded) {
      html += "<div><h3>" + t("steps") + "</h3>" + a.steps.map(function (s, i) { return '<button class="step' + (s.done ? " done" : "") + '" data-step="' + a.id + ":" + i + '"><span class="n">' + (s.done ? "✓" : i + 1) + "</span><span>" + esc(s.text) + "</span></button>"; }).join("") + "</div>";
      if (a.missing.length && a.status !== "done") html += '<div class="insight attention"><b>' + t("missing") + "</b><p>" + a.missing.map(esc).join(" · ") + "</p></div>";
      if (a.draft) html += "<div><h3 style=\"margin-bottom:6px\">" + t("draft") + '</h3><pre class="draft" id="draft-' + a.id + '">' + esc(a.draft) + '</pre><button class="btn soft" style="margin-top:8px" data-copy="' + a.id + '">' + t("copy") + "</button></div>";
      html += '<p class="small muted">' + t("control") + "</p>";
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (a.status !== "done" ? '<button class="btn" data-actdone="' + a.id + '">' + t("markDone") + "</button>" : "") + '<button class="btn danger" data-actdel="' + a.id + '">' + t("del") + "</button></div>";
    }
    return html + "</div>";
  }

  function vLife() {
    var tab = ui.lifeTab;
    var html = '<div class="stack"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:8px"><div><h1 class="h-page">' + t("life") + '</h1><p class="muted" style="margin-top:2px">' + t("lifeSub") + '</p></div><button class="btn" id="newtask" style="flex-shrink:0">+</button></div>' +
      '<div class="seg" role="group">' + [["today", t("today")], ["week", t("week")], ["open", t("open")]].map(function (x) { return '<button data-life="' + x[0] + '" aria-pressed="' + (tab === x[0]) + '">' + x[1] + "</button>"; }).join("") + "</div>";
    if (tab === "today") {
      var list = state.tasks.filter(function (x) { return x.due && (x.due === TODAY || (x.due < TODAY && !x.done)); });
      html += '<div class="card"><div class="card-head"><h3>' + fmtDate(TODAY, { weekday: "long", day: "numeric", month: "long" }) + "</h3></div>" + (list.length ? list.map(taskRow).join("") : '<div class="empty">' + t("allClear") + "</div>") + "</div>";
    } else if (tab === "week") {
      var dow = (new Date().getDay() + 6) % 7;
      var days = []; for (var i = 0; i < 7; i++) days.push(addDays(i - dow));
      html += '<div class="week">' + days.map(function (d) {
        var items = state.tasks.filter(function (x) { return x.due === d; });
        return '<div class="day' + (d === TODAY ? " today" : "") + '"><div class="dn">' + fmtDate(d, { weekday: "short" }) + '</div><div class="dd">' + Number(d.slice(8)) + "</div>" + items.map(function (x) { return '<span class="dot ' + x.kind + '" title="' + esc(x.title) + '"></span>'; }).join("") + "</div>";
      }).join("") + "</div>";
      html += '<div class="card">' + days.map(function (d) { var it = state.tasks.filter(function (x) { return x.due === d; }); return it.length ? '<p class="eyebrow" style="margin-top:8px">' + fmtDate(d, { weekday: "long", day: "numeric", month: "short" }) + "</p>" + it.map(taskRow).join("") : ""; }).join("") + "</div>";
    } else {
      var open = state.tasks.filter(function (x) { return !x.done; }).sort(function (a, b) { return (a.due || "9") < (b.due || "9") ? -1 : 1; });
      html += '<div class="card">' + (open.length ? open.map(taskRow).join("") : '<div class="empty">' + t("allClear") + "</div>") + "</div>";
    }
    return html + "</div>";
  }

  function vIntel() {
    var ins = insights();
    return '<div class="stack"><div><h1 class="h-page">' + t("intel") + '</h1><p class="muted" style="margin-top:2px">' + t("intSub") + "</p></div>" +
      "<h3>" + t("insights") + "</h3>" + (ins.length ? ins.map(insightHtml).join("") : '<div class="empty">' + t("noInsights") + "</div>") +
      '<h3 style="margin-top:6px">' + t("askOne") + "</h3>" + (ui.mode = "ask", composer()) + "</div>";
  }

  /* ───────── sheets ───────── */
  function openSheet(inner, onBind) {
    var root = document.getElementById("sheet-root");
    root.innerHTML = '<div class="sheet-bg" id="sheet-bg"></div><div class="sheet" role="dialog" aria-modal="true"><div class="wrap"><div class="grab"></div>' + inner + "</div></div>";
    document.getElementById("sheet-bg").onclick = closeSheet;
    if (onBind) onBind();
    var f = root.querySelector("input,textarea"); if (f) f.focus();
  }
  function closeSheet() { document.getElementById("sheet-root").innerHTML = ""; }

  function memSheet() {
    openSheet('<form id="memform" class="stack"><h3>' + t("newMem") + '</h3><div><label class="lbl" for="mt">' + t("title") + '</label><input class="field" id="mt" required maxlength="120"></div>' +
      '<div><label class="lbl" for="mc">' + t("content") + '</label><textarea class="field" id="mc"></textarea></div>' +
      '<div><label class="lbl" for="mg">' + t("tags") + '</label><input class="field" id="mg" placeholder="' + t("tagsHint") + '"></div>' +
      '<div class="grid2"><button type="button" class="btn secondary" id="mcancel">' + t("cancel") + '</button><button class="btn" type="submit">' + t("save") + "</button></div></form>", function () {
      document.getElementById("mcancel").onclick = closeSheet;
      document.getElementById("memform").onsubmit = function (e) {
        e.preventDefault();
        var title = document.getElementById("mt").value.trim(); if (!title) return;
        state.memories.push({ id: uid(), title: title, content: document.getElementById("mc").value.trim(), tags: document.getElementById("mg").value.split(",").map(function (s) { return s.trim().toLowerCase(); }).filter(Boolean), at: Date.now() });
        persist(); closeSheet(); render();
      };
    });
  }

  function memDetail(id) {
    var m = state.memories.find(function (x) { return x.id === id; }); if (!m) return;
    openSheet('<div class="stack"><div style="display:flex;gap:6px;flex-wrap:wrap">' + m.tags.map(function (tg) { return '<span class="chip">#' + esc(tg) + "</span>"; }).join("") + exChip(m) + "</div><h3 style=\"font-size:20px\">" + esc(m.title) + '</h3><p style="white-space:pre-wrap">' + esc(m.content) + '</p><div id="delzone"><button class="btn danger" id="mdel">' + t("del") + "</button></div></div>", function () {
      document.getElementById("mdel").onclick = function () {
        document.getElementById("delzone").innerHTML = '<p class="small" style="margin-bottom:8px">' + t("delConfirm") + '</p><div class="grid2"><button class="btn secondary" id="mno">' + t("cancel") + '</button><button class="btn danger" id="myes">' + t("yesDel") + "</button></div>";
        document.getElementById("mno").onclick = closeSheet;
        document.getElementById("myes").onclick = function () { state.memories = state.memories.filter(function (x) { return x.id !== id; }); persist(); closeSheet(); render(); };
      };
    });
  }

  function taskSheet() {
    openSheet('<form id="tform" class="stack"><h3>' + t("newItem") + '</h3><div><label class="lbl" for="tt">' + t("title") + '</label><input class="field" id="tt" required maxlength="120"></div>' +
      '<div class="grid2"><div><label class="lbl" for="tk">' + t("type") + '</label><select class="field" id="tk"><option value="task">' + t("kind_task") + '</option><option value="appointment">' + t("kind_appointment") + '</option><option value="deadline">' + t("kind_deadline") + "</option></select></div>" +
      '<div><label class="lbl" for="td">' + t("date") + '</label><input class="field" id="td" type="date" value="' + TODAY + '"></div></div>' +
      '<div class="grid2"><button type="button" class="btn secondary" id="tcancel">' + t("cancel") + '</button><button class="btn" type="submit">' + t("add") + "</button></div></form>", function () {
      document.getElementById("tcancel").onclick = closeSheet;
      document.getElementById("tform").onsubmit = function (e) {
        e.preventDefault();
        var title = document.getElementById("tt").value.trim(); if (!title) return;
        state.tasks.push({ id: uid(), title: title, kind: document.getElementById("tk").value, due: document.getElementById("td").value || null, done: false });
        persist(); closeSheet(); render();
      };
    });
  }

  /* ───────── events ───────── */
  function go(v) { view = v; ui.answer = null; ui.toast = ""; ui.openAction = null; try { history.replaceState(null, "", "#" + v); } catch (e) {} render(); window.scrollTo(0, 0); }

  function bind() {
    document.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { go(b.getAttribute("data-go")); }; });
    var start = document.getElementById("start");
    if (start) start.onclick = function () {
      var name = document.getElementById("name").value.trim();
      if (!state) state = seed(name); else state.name = name || state.name;
      persist(); go("home");
    };
    var form = document.getElementById("composer");
    if (form) {
      var cin = document.getElementById("cin"), sendB = form.querySelector(".send");
      cin.oninput = function () { sendB.disabled = !cin.value.trim(); };
      cin.onkeydown = function (e) { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (cin.value.trim()) form.requestSubmit(); } };
      form.querySelectorAll("[data-mode]").forEach(function (b) { b.onclick = function () { ui.mode = b.getAttribute("data-mode"); ui.answer = null; ui.toast = ""; render(); var c = document.getElementById("cin"); if (c) c.focus(); }; });
      form.onsubmit = function (e) {
        e.preventDefault();
        var text = cin.value.trim(); if (!text) return;
        ui.toast = ""; ui.answer = null;
        if (ui.mode === "ask") ui.answer = { q: text, hits: searchMem(text) };
        else if (ui.mode === "remember") {
          var first = text.split("\n")[0];
          state.memories.push({ id: uid(), title: first.length > 60 ? first.slice(0, 57) + "…" : first, content: text, tags: (text.match(/#[\wäöüß-]+/gi) || []).map(function (s) { return s.slice(1).toLowerCase(); }), at: Date.now() });
          ui.toast = t("savedMem");
        } else {
          state.tasks.push({ id: uid(), title: text.slice(0, 120), kind: "task", due: TODAY, done: false });
          ui.toast = t("savedTask");
        }
        persist(); render();
      };
    }
    document.querySelectorAll("[data-toggle]").forEach(function (b) { b.onclick = function () {
      var x = state.tasks.find(function (y) { return y.id === b.getAttribute("data-toggle"); }); if (!x) return;
      x.done = !x.done; x.doneAt = x.done ? Date.now() : null; persist(); render(); }; });
    var memq = document.getElementById("memq");
    if (memq) memq.oninput = function () { ui.memQ = memq.value; var pos = memq.selectionStart; render(); var m2 = document.getElementById("memq"); m2.focus(); try { m2.setSelectionRange(pos, pos); } catch (e) {} };
    var nm = document.getElementById("newmem"); if (nm) { nm.onclick = memSheet; nm.setAttribute("aria-label", t("newMem")); }
    document.querySelectorAll("[data-mem]").forEach(function (b) { b.onclick = function () { memDetail(b.getAttribute("data-mem")); }; });
    var nt = document.getElementById("newtask"); if (nt) { nt.onclick = taskSheet; nt.setAttribute("aria-label", t("newItem")); }
    document.querySelectorAll("[data-life]").forEach(function (b) { b.onclick = function () { ui.lifeTab = b.getAttribute("data-life"); render(); }; });
    document.querySelectorAll("[data-type]").forEach(function (b) { b.onclick = function () { ui.actionType = b.getAttribute("data-type"); document.querySelectorAll("[data-type]").forEach(function (o) { o.setAttribute("aria-pressed", String(o === b)); }); }; });
    var af = document.getElementById("actform");
    if (af) af.onsubmit = function (e) {
      e.preventDefault();
      var title = document.getElementById("atitle").value.trim(); if (!title) return;
      var d = document.getElementById("adesc").value.trim(), ty = TYPES[ui.actionType];
      var missing = ty.missing(lang, d);
      var a = { id: uid(), type: ui.actionType, title: title, desc: d, status: missing.length ? "waiting" : "new", steps: ty.steps[lang].map(function (s) { return { text: s, done: false }; }), draft: ty.draft(lang, title, d), missing: missing };
      state.actions.push(a); ui.openAction = a.id; persist(); render();
    };
    document.querySelectorAll("[data-act]").forEach(function (b) { b.onclick = function () { var id = b.getAttribute("data-act"); ui.openAction = ui.openAction === id ? null : id; render(); }; });
    document.querySelectorAll("[data-step]").forEach(function (b) { b.onclick = function () {
      var p = b.getAttribute("data-step").split(":"), a = state.actions.find(function (x) { return x.id === p[0]; }); if (!a) return;
      a.steps[+p[1]].done = !a.steps[+p[1]].done; if (a.status === "new") a.status = "in_progress"; persist(); render(); }; });
    document.querySelectorAll("[data-actdone]").forEach(function (b) { b.onclick = function () { var a = state.actions.find(function (x) { return x.id === b.getAttribute("data-actdone"); }); a.status = "done"; persist(); render(); }; });
    document.querySelectorAll("[data-actdel]").forEach(function (b) { b.onclick = function () { state.actions = state.actions.filter(function (x) { return x.id !== b.getAttribute("data-actdel"); }); persist(); render(); }; });
    document.querySelectorAll("[data-copy]").forEach(function (b) { b.onclick = function () {
      var pre = document.getElementById("draft-" + b.getAttribute("data-copy")), text = pre.textContent;
      var ok = function () { b.textContent = t("copied"); setTimeout(function () { b.textContent = t("copy"); }, 1600); };
      try { navigator.clipboard.writeText(text).then(ok, function () { selectText(pre); }); } catch (err) { selectText(pre); } }; });
    var rs = document.getElementById("reset");
    if (rs) rs.onclick = function () {
      document.getElementById("reset-confirm").innerHTML = '<p class="small" style="margin:6px 0 8px">' + t("resetQ") + '</p><div class="grid2"><button class="btn secondary" id="rno">' + t("cancel") + '</button><button class="btn danger" id="ryes">' + t("resetYes") + "</button></div>";
      document.getElementById("rno").onclick = function () { document.getElementById("reset-confirm").innerHTML = ""; };
      document.getElementById("ryes").onclick = function () { try { localStorage.removeItem(KEY); } catch (e) {} state = null; go("landing"); };
    };
  }
  function selectText(el) { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

  /* ───────── boot ───────── */
  document.getElementById("lang-de").onclick = function () { lang = "de"; if (state) { state.lang = lang; persist(); } render(); };
  document.getElementById("lang-en").onclick = function () { lang = "en"; if (state) { state.lang = lang; persist(); } render(); };
  document.getElementById("logo").onclick = function () { go(state ? "home" : "landing"); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });

  state = load();
  if (state && state.lang) lang = state.lang;
  else { try { lang = /^en/i.test(navigator.language || "") ? "en" : "de"; } catch (e) {} }
  var h = (location.hash || "").slice(1);
  view = state ? (["home", "memory", "action", "life", "intel"].indexOf(h) >= 0 ? h : "home") : "landing";
  window.addEventListener("hashchange", function () { var v = location.hash.slice(1); if (state && ["home", "memory", "action", "life", "intel"].indexOf(v) >= 0 && v !== view) { view = v; render(); } });
  render();
})();
</script>
