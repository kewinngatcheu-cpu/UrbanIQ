<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONE · Offline</title>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;background:linear-gradient(180deg,#F8FBFF,#EFF7FF);color:#23364D;padding:24px;box-sizing:border-box}
  .card{max-width:380px;width:100%;background:#fff;border:1px solid #DCEEFF;border-radius:28px;padding:32px;box-shadow:0 20px 50px -24px rgba(67,142,212,.35);text-align:center}
  img{width:64px;height:64px;border-radius:18px}
  h1{font-size:22px;margin:18px 0 6px}
  p{color:#718096;font-size:15px;line-height:1.5;margin:0 0 6px}
  button{margin-top:18px;height:44px;padding:0 20px;border:0;border-radius:14px;background:#438ED4;color:#fff;font-size:15px;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="ONE">
    <h1>Keine Verbindung · You're offline</h1>
    <p>ONE braucht eine Internetverbindung, damit deine Daten sicher auf dem Server bleiben.</p>
    <p>ONE needs a connection — your data stays safely on the server, not on this device.</p>
    <button onclick="location.reload()">Erneut versuchen · Retry</button>
  </div>
</body>
</html>
